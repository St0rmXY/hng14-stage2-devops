name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  REGISTRY: localhost:5000

jobs:
# ══════════════════════════════════════════════════════════════════════════════
# STAGE 1 — LINT
# ══════════════════════════════════════════════════════════════════════════════
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      # Python — flake8
      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Lint Python (flake8)
        run: |
          flake8 api/ worker/ \
            --max-line-length=120 \
            --exclude=__pycache__,.git \
            --statistics

      # JavaScript — eslint
      - name: Set up Node
        uses: actions/setup-node@v4.4.0
        with:
          node-version: "20"

      - name: Install ESLint
        run: |
          cd frontend
          npm ci || npm install
          npx eslint --version

      - name: Lint JavaScript (eslint)
        run: |
          cd frontend
          npx eslint . 

      # Dockerfiles — hadolint
      - name: Install hadolint
        run: |
          curl -sSL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 \
            -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint

      - name: Lint Dockerfiles (hadolint)
        run: |
          hadolint api/Dockerfile
          hadolint worker/Dockerfile
          hadolint frontend/Dockerfile
