name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

env:
  REGISTRY: localhost:5000

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Lint Python with flake8
        run: |
          flake8 api/ worker/ \
            --max-line-length=120 \
            --exclude=__pycache__,.git \
            --statistics

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Lint JavaScript with eslint
        run: |
          cd frontend
          npx eslint .

      - name: Install hadolint
        run: |
          curl -sSL https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64 \
            -o /usr/local/bin/hadolint
          chmod +x /usr/local/bin/hadolint

      - name: Lint Dockerfiles with hadolint
        run: |
          hadolint --ignore DL3008 --ignore DL3013 --ignore DL3042 --ignore DL3018 api/Dockerfile
          hadolint --ignore DL3008 --ignore DL3013 --ignore DL3042 --ignore DL3018 worker/Dockerfile
          hadolint --ignore DL3008 --ignore DL3013 --ignore DL3042 --ignore DL3018 frontend/Dockerfile

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        run: pip install -r api/requirements.txt

      - name: Run pytest with coverage
        run: |
          cd api
          pytest tests/ \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: api/coverage.xml

  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: test
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.REGISTRY }}/api:${{ github.sha }}
            ${{ env.REGISTRY }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push worker image
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: true
          tags: |
            ${{ env.REGISTRY }}/worker:${{ github.sha }}
            ${{ env.REGISTRY }}/worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/frontend:${{ github.sha }}
            ${{ env.REGISTRY }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security-scan:
    name: Security Scan with Trivy
    runs-on: ubuntu-latest
    needs: build
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Rebuild images into local registry with no cache
        run: |
          docker buildx build --no-cache --push \
            -t ${{ env.REGISTRY }}/api:${{ github.sha }} ./api
          docker buildx build --no-cache --push \
            -t ${{ env.REGISTRY }}/worker:${{ github.sha }} ./worker
          docker buildx build --no-cache --push \
            -t ${{ env.REGISTRY }}/frontend:${{ github.sha }} ./frontend

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/api:${{ github.sha }}"
          format: sarif
          output: trivy-api.sarif
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: "os,library"
          scanners: "vuln"

      - name: Scan worker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/worker:${{ github.sha }}"
          format: sarif
          output: trivy-worker.sarif
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: "os,library"
          scanners: "vuln"

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/frontend:${{ github.sha }}"
          format: sarif
          output: trivy-frontend.sarif
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true
          vuln-type: "os,library"
          scanners: "vuln"

      - name: Upload Trivy SARIF results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-sarif-results
          path: |
            trivy-api.sarif
            trivy-worker.sarif
            trivy-frontend.sarif

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create .env from example
        run: cp .env.example .env

      - name: Make integration script executable
        run: chmod +x integration.sh

      - name: Run integration tests
        run: ./integration.sh

      - name: Tear down stack always
        if: always()
        run: docker compose down -v --remove-orphans

  deploy:
    name: Deploy Rolling Update
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Run rolling update on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GIT_SHA: ${{ github.sha }}
        run: |
          ssh $DEPLOY_USER@$DEPLOY_HOST bash -s << 'ENDSSH'
            set -e
            cd ~/app
            git pull origin main

            SERVICES="api worker frontend"

            for SERVICE in $SERVICES; do
              echo "=== Rolling update: $SERVICE ==="

              OLD_CONTAINER=$(docker compose ps -q $SERVICE 2>/dev/null || true)

              docker compose build $SERVICE
              docker compose up -d --no-deps --scale ${SERVICE}=2 $SERVICE

              NEW_CONTAINER=$(docker compose ps -q $SERVICE | head -1)
              HEALTHY=false

              for i in $(seq 1 12); do
                HEALTH=$(docker inspect --format='{{.State.Health.Status}}' $NEW_CONTAINER 2>/dev/null || echo "none")
                echo "  Health check attempt $i: $HEALTH"
                if [ "$HEALTH" = "healthy" ]; then
                  HEALTHY=true
                  break
                fi
                sleep 5
              done

              if [ "$HEALTHY" = "true" ]; then
                echo "  New container healthy - stopping old container"
                if [ -n "$OLD_CONTAINER" ]; then
                  docker stop $OLD_CONTAINER || true
                  docker rm $OLD_CONTAINER || true
                fi
                docker compose up -d --no-deps --scale ${SERVICE}=1 $SERVICE
                echo "  $SERVICE updated successfully"
              else
                echo "  ERROR: Health check failed - aborting, keeping old container"
                docker compose up -d --no-deps --scale ${SERVICE}=1 $SERVICE
                exit 1
              fi
            done

            echo "=== All services updated ==="
            docker compose ps
          ENDSSH
